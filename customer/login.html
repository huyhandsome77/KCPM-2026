<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký - AppDatMon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="auth-screen">
      <div class="auth-card card">
        <div class="auth-header">
          <h1 class="auth-title">Chào mừng trở lại</h1>
          <p class="auth-copy">Đăng nhập để nhận ưu đãi và đặt món ngay lập tức.</p>
        </div>
        <form id="authForm" class="form-grid">
          <div class="field auth-switch">
            <button type="button" id="loginBtn" class="btn btn-secondary">Đăng nhập</button>
            <button type="button" id="registerBtn" class="btn btn-secondary">Đăng ký</button>
          </div>
          <div id="loginFields">
            <div class="field">
              <label for="loginAccount">Tài khoản</label>
              <input id="loginAccount" type="text" placeholder="Email, số điện thoại hoặc tên đăng nhập" required />
            </div>
            <div class="field">
              <label for="loginPassword">Mật khẩu</label>
              <input id="loginPassword" type="password" placeholder="Mật khẩu" required />
            </div>
            <div class="inline-actions">
              <a href="#">Quên mật khẩu?</a>
            </div>
          </div>
          <div id="registerFields" class="hidden">
            <div class="field">
              <label for="registerName">Họ tên</label>
              <input id="registerName" type="text" placeholder="Nguyễn Văn A" />
            </div>
            <div class="field">
              <label for="registerEmail">Email</label>
              <input id="registerEmail" type="email" placeholder="email@example.com" />
            </div>
            <div class="field">
              <label for="registerPassword">Mật khẩu</label>
              <input id="registerPassword" type="password" placeholder="Mật khẩu" />
            </div>
            <div class="field">
              <label for="registerConfirm">Xác nhận mật khẩu</label>
              <input id="registerConfirm" type="password" placeholder="Xác nhận mật khẩu" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
          <div class="divider"><span>Hoặc</span></div>
          <button type="button" class="btn btn-secondary btn-block"><i class="fa-brands fa-google"></i> Đăng nhập bằng Google</button>
        </form>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
