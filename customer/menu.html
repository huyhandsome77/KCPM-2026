<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FutureSuShi | Thực đơn</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- FontAwesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="./css/styles.css">

    <link rel="stylesheet" href="./css/layout.css">

    <link rel="stylesheet" href="./css/menu.css">

    <link rel="stylesheet" href="./css/responsive.css">

</head>

<body>

<div class="ambient ambient-left"></div>

<div class="ambient ambient-right"></div>

<header class="header">

    <div class="logo">

        <img src="./assets/logo.png">

        <span>FutureSuShi</span>

    </div>

    <nav>

        <a href="index.html">

            Trang chủ

        </a>

        <a href="menu.html"
           class="active">

            Thực đơn

        </a>

        <a href="booking.html">

            Đặt bàn

        </a>

        <a href="review.html">

            Đánh giá

        </a>

        <a href="about.html">

            Giới thiệu

        </a>

        <a href="contact.html">

            Liên hệ

        </a>

    </nav>

    <div class="user-box">

        <i class="fa-solid fa-user"></i>

        <span id="username">

            Khách

        </span>

        <a href="login.html"
           class="logout-btn">

            Đăng nhập

        </a>

    </div>

</header>

<main class="section">

    <div class="section-title">

        <span>

            MENU

        </span>

        <h2>

            Thực đơn FutureSuShi

        </h2>

        <p>

            Khám phá những món ăn Nhật Bản được yêu thích nhất.

        </p>

    </div>


    <div class="menu-toolbar">

    <input

        id="searchInput"

        type="text"

        placeholder="🔍 Tìm món ăn...">

    <select id="categorySelect">

        <option value="">

            Tất cả danh mục

        </option>

    </select>

</div>



<div class="menu-layout">

    <section
        id="productGrid"
        class="product-grid">

    </section>


    <aside class="cart-panel">

    <h3>

        🛒 Giỏ hàng

    </h3>

    <div id="cartItems">

    </div>

    <div class="cart-total">

        Tổng:

        <span id="totalPrice">

            0đ

        </span>

    </div>

    <button

        id="checkoutBtn"

        class="btn btn-primary btn-block">

        Đặt món

    </button>

</aside>

</div>

</main>


<footer class="footer">

<div class="footer-bottom">

© 2026 FutureSuShi

</div>

</footer>

<script src="./js/app.js"></script>

<script src="./js/menu.js"></script>

</body>

</html>
