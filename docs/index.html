<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tài liệu & Trình khám phá API hoàn chỉnh cho AppDatMon Restaurant Management Backend (Node.js, Express, Sequelize, PayOS)">
  <title>AppDatMon API Documentation & Interactive Explorer</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/docs.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Sticky Header -->
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <button class="nav-btn" id="btn-sidebar-toggle" style="display:none; padding:0 0.5rem;" title="Mở Sidebar">
          <i class="fas fa-bars"></i>
        </button>
        <div class="nav-brand" style="cursor:pointer;" onclick="window.DocApp.navigate('overview')">
          <i class="fas fa-utensils" style="color:var(--accent-primary);"></i>
          <span>AppDatMon <span style="font-weight:400; color:var(--text-muted); font-size:0.95rem;">API Docs</span></span>
          <span class="brand-badge">REST v1.0</span>
        </div>
      </div>

      <!-- Search Input -->
      <div class="nav-search-wrapper">
        <i class="fas fa-search nav-search-icon"></i>
        <input type="text" id="global-search-input" class="nav-search-input" placeholder="Tìm kiếm API, Endpoint, Path, Role, Module... (Ctrl + K)">
        <span class="nav-search-kbd">Ctrl K</span>
      </div>

      <!-- Action Tools -->
      <div class="nav-actions">
        <button class="nav-btn" id="btn-export-openapi" title="Xem OpenAPI 3.0.3 Specification">
          <i class="fas fa-file-code" style="color:var(--accent-primary);"></i>
          <span style="display:none; @media(min-width:768px){display:inline;}">OpenAPI Spec</span>
        </button>
        <button class="nav-btn" id="btn-export-postman" title="Tải xuống Postman Collection v2.1">
          <i class="fas fa-download" style="color:var(--accent-warning);"></i>
          <span>Postman</span>
        </button>
        <button class="nav-btn primary" id="btn-open-playground" title="Mở Trình gửi Request Trực tiếp">
          <i class="fas fa-play"></i>
          <span>Try It Out</span>
        </button>
        <button class="nav-btn" id="theme-toggle-btn" title="Chuyển đổi Sáng / Tối">
          <i class="fas fa-moon" id="theme-icon"></i>
        </button>
      </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="main-layout">
      <!-- Left Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-nav" id="sidebar-nav">
          <!-- Populated dynamically by app.js -->
        </div>
      </aside>

      <!-- Center Documentation Content -->
      <section class="content-area" id="content-area">
        <!-- Populated dynamically by app.js -->
      </section>

      <!-- Right Interactive Try-It-Out Panel -->
      <aside class="playground-area" id="playground-area">
        <div class="playground-header">
          <div class="playground-title">
            <i class="fas fa-terminal" style="color:var(--accent-primary);"></i>
            <span>Interactive API Explorer</span>
          </div>
          <button class="btn-copy" id="btn-close-playground" style="font-size:0.9rem;" title="Đóng Playground">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="playground-body" id="playground-body">
          <div style="text-align:center; padding:3rem 1rem; color:var(--text-muted);">
            <i class="fas fa-hand-pointer" style="font-size:2rem; margin-bottom:1rem; color:var(--accent-primary);"></i>
            <p>Chọn một API bất kỳ ở danh sách bên trái hoặc nhấn nút <strong>"Try It Out"</strong> trên Endpoint để thử nghiệm gửi request trực tiếp đến Backend.</p>
          </div>
        </div>
      </aside>
    </main>

    <!-- Toast Notification Hub -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- Data Specification Dataset -->
  <script src="./js/data.js"></script>

  <!-- Application Controller -->
  <script src="./js/app.js"></script>
</body>
</html>
